<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1C2026">
<meta name="description" content="100 tests sécurité pour techniciens : électricité, froid, vapeur, hauteur, EPI, consignation, ATEX, chimique, levage, incendie.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Test Sécurité Industrie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
html,body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* Layout : appli mobile une colonne, bandeau graphite + bande de balisage jaune/noir, panneaux de sécurité normalisés comme icônes de thèmes */
:root{
  --bg:#F3F4F1;--surface:#FFFFFF;--ink:#15181C;--muted:#5A626A;--line:#DCDFD9;
  --band:#1C2026;--band-ink:#F3F4F1;--accent:#F2B300;--accent-ink:#15181C;
  --ok:#1D7448;--ok-bg:#E2F1E8;--bad:#B0261F;--bad-bg:#FBE6E3;
  --sign-blue:#1E5DA6;--sign-red:#C42A26;--sign-green:#1D7448;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111316;--surface:#1A1E22;--ink:#ECEEEA;--muted:#9BA3AA;--line:#2B3136;
  --band:#0A0C0E;--band-ink:#ECEEEA;--accent:#F5BE1E;--accent-ink:#15181C;
  --ok:#62C690;--ok-bg:#15301F;--bad:#F2877D;--bad-bg:#3A1916;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111316;--surface:#1A1E22;--ink:#ECEEEA;--muted:#9BA3AA;--line:#2B3136;
  --band:#0A0C0E;--band-ink:#ECEEEA;--accent:#F5BE1E;--accent-ink:#15181C;
  --ok:#62C690;--ok-bg:#15301F;--bad:#F2877D;--bad-bg:#3A1916;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 32px}
/* bandeau */
.band{background:var(--band);color:var(--band-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.band-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:60px}
.stripe{height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,#15181C 12px 24px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-name{font-family:var(--display);font-weight:700;font-size:22px;line-height:1;letter-spacing:.02em;text-transform:uppercase}
.brand-name small{display:block;font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.12em}
.back{background:none;border:0;color:var(--band-ink);padding:8px;margin-left:-8px;border-radius:8px;display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:600}
.back:focus-visible,.btn:focus-visible,.opt:focus-visible,.card:focus-visible,.test:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.band-title{font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.03em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.band-count{font-variant-numeric:tabular-nums;font-weight:600;color:var(--accent)}
/* accueil */
.hero{padding-block:22px 8px;display:grid;gap:14px}
.hero h1{font-family:var(--display);font-size:34px;line-height:1.02;margin:0;text-transform:uppercase;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.meter{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.meter-num{font-family:var(--display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.meter-num span{font-size:20px;color:var(--muted)}
.meter-lbl{font-size:14px;color:var(--muted);margin-bottom:6px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .4s}
.section-lbl{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.grid{display:grid;gap:10px}
.card{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.card:active{transform:scale(.99)}
.card h3{margin:0;font-size:17px;font-weight:700;line-height:1.2}
.card p{margin:3px 0 7px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.card .bar{height:6px}
.chev{color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin-top:24px;line-height:1.5}
/* liste de tests */
.theme-head{display:flex;gap:14px;align-items:center;padding-block:20px 6px}
.theme-head h2{font-family:var(--display);font-size:28px;line-height:1.05;margin:0;text-transform:uppercase}
.theme-head p{margin:2px 0 0;color:var(--muted);font-size:14px}
.test{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}
.test-n{width:40px;height:40px;border-radius:10px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.test h3{margin:0;font-size:16px;font-weight:600;line-height:1.25}
.test p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.chip{font-size:13px;font-weight:700;padding:4px 9px;border-radius:999px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.new{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
/* quiz */
.qtop{padding-block:16px 6px;display:grid;gap:8px}
.qmeta{display:flex;justify-content:space-between;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.qtext{font-size:20px;font-weight:600;line-height:1.35;margin:14px 0 18px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px;line-height:1.35}
.opt .k{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:700;font-family:var(--display);font-size:18px}
.opt[disabled]{cursor:default}
.opt.good{border-color:var(--ok);background:var(--ok-bg)}
.opt.good .k{background:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.55}
.expl{margin-top:16px;border-radius:12px;padding:14px;border-left:5px solid var(--ok);background:var(--surface);border-top:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.expl.bad{border-left-color:var(--bad)}
.expl b{display:block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.expl.okk b{color:var(--ok)} .expl.bad b{color:var(--bad)}
.btn{text-decoration:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:12px;padding:15px 16px;font-weight:700;font-size:17px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:var(--band);color:var(--band-ink)}
.actions{display:grid;gap:10px;margin-top:18px}
.quitbar{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.quitbar p{margin:0;font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* résultat */
.result{padding-block:22px 0;display:grid;gap:16px}
.score{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:10px;justify-items:center;text-align:center}
.score-num{font-family:var(--display);font-weight:700;font-size:72px;line-height:.9;font-variant-numeric:tabular-nums}
.score-num span{font-size:32px;color:var(--muted)}
.stamp{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;text-transform:uppercase;padding:6px 14px;border:3px solid currentColor;border-radius:8px;transform:rotate(-3deg)}
.stamp.ok{color:var(--ok)} .stamp.bad{color:var(--bad)}
.score small{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px}
.panel h3{margin:0;font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.02em}
.panel p{margin:0;color:var(--muted);font-size:14px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input{font:inherit;font-size:16px;width:100%;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.okmsg{color:var(--ok);font-size:14px;font-weight:600}
.addr{font-weight:700;color:var(--ink);word-break:break-all}
.review{display:grid;gap:10px}
.rv{border-left:4px solid var(--bad);padding:4px 0 4px 12px}
.rv.okk{border-left-color:var(--ok)}
.rv p{margin:0}
.rv .q{font-weight:600;color:var(--ink);font-size:15px}
.rv .a{font-size:14px;color:var(--muted);margin-top:3px}
.rv .a b{color:var(--ink)}
/* panneaux */
.sign{width:56px;height:56px;display:block}
.sign.sm{width:44px;height:44px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.fade{animation:fade .25s ease-out}
@keyframes fade{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

</head>
<body>
<header class="band"><div class="band-in" id="bandIn"></div><div class="stripe"></div></header>
<main class="wrap" id="app"></main>

<script>
const VF=["Vrai","Faux"];const T=[];
T.push({id:"elec",name:"Électrique",sign:"tri",glyph:"↯",tests:[
{t:"Les bases du risque électrique",q:[
["L'électrocution, c'est :",["Une électrisation qui entraîne la mort","Une simple secousse sans gravité","Une brûlure légère de la main"],0,"L'électrisation est le passage du courant dans le corps. On parle d'électrocution quand elle entraîne la mort."],
["À partir de quelle intensité environ un courant alternatif peut-il provoquer une fibrillation cardiaque ?",["30 mA","1 mA","10 A"],0,"Vers 30 mA, le risque de fibrillation devient réel. C'est pourquoi les différentiels de protection des personnes sont réglés à 30 mA."],
["Un dispositif différentiel 30 mA sert d'abord à :",["Protéger les personnes","Protéger les câbles contre la surcharge","Mesurer la consommation"],0,"Le différentiel détecte une fuite de courant vers la terre et coupe avant que le courant devienne mortel."],
["En courant alternatif, le domaine BT va de :",["50 V à 1 000 V","0 à 50 V","1 000 V à 50 000 V"],0,"TBT jusqu'à 50 V, BT de 50 à 1 000 V, HTA de 1 000 à 50 000 V (en alternatif)."],
["Lequel de ces facteurs aggrave le risque d'électrisation ?",["La peau mouillée","Des chaussures isolantes","Un tapis isolant"],0,"L'eau diminue fortement la résistance du corps : le courant passe plus facilement."],
["Un contact indirect, c'est toucher :",["Une masse mise accidentellement sous tension","Un conducteur nu normalement sous tension","Un câble hors tension"],0,"Exemple : la carcasse métallique d'une machine dont un fil s'est dénudé à l'intérieur."],
["Un contact direct, c'est toucher :",["Une partie active normalement sous tension","Une carcasse de machine","Un tuyau en PVC"],0,"Exemple : une borne de disjoncteur ou un conducteur dénudé."],
["Un arc électrique peut provoquer :",["Des brûlures graves et des lésions des yeux","Seulement un bruit","Aucun danger si on ne touche rien"],0,"L'arc dégage une chaleur extrême et un rayonnement UV intense, même sans contact."],
["En local sec, la tension limite de sécurité en alternatif est de :",["50 V","230 V","12 V"],0,"50 V en alternatif en local sec, 25 V en local humide."],
["Une personne électrisée reste collée à une machine. Premier geste :",["Couper le courant avant de la toucher","La tirer par le bras","L'arroser d'eau"],0,"Sans coupure, le sauveteur devient la deuxième victime."]
]},
{t:"Les habilitations",q:[
["La norme de référence pour les habilitations électriques est :",["NF C 18-510","NF C 15-100","EN 166"],0,"NF C 18-510 traite des opérations sur les installations. NF C 15-100 traite de la conception des installations BT."],
["Qui délivre le titre d'habilitation ?",["L'employeur","L'organisme de formation","L'inspection du travail"],0,"La formation donne un avis. C'est l'employeur qui signe le titre."],
["Le symbole B1 correspond à :",["Exécutant de travaux d'ordre électrique en BT","Chargé de travaux BT","Chargé de consignation BT"],0,"Le 1 désigne un exécutant, le 2 un chargé de travaux."],
["Le symbole B2 correspond à :",["Chargé de travaux d'ordre électrique en BT","Exécutant non électricien","Chargé d'intervention élémentaire"],0,"Le B2 dirige les travaux et assure la sécurité de son équipe."],
["Le symbole BC correspond à :",["Chargé de consignation en BT","Chargé de chantier","Contrôleur"],0,"Le BC réalise la consignation et remet l'attestation."],
["Le symbole BR correspond à :",["Chargé d'intervention BT générale (dépannage, mesures)","Exécutant non électricien","Manœuvre d'urgence"],0,"BR : recherche de panne, mesures, remplacement de matériel, mise en service partielle."],
["Le symbole BS permet :",["Des interventions BT élémentaires (remplacer un fusible, une prise à l'identique)","Tous les dépannages","Les travaux sous tension"],0,"BS : remplacement à l'identique et raccordement simple, après mise hors tension."],
["Les symboles B0 / H0 concernent :",["Les travaux d'ordre non électrique dans un environnement électrique","Les électriciens confirmés","La haute tension uniquement"],0,"Exemple : un peintre ou un mécanicien qui travaille dans un local électrique."],
["L'attribut « Manœuvre » (BE Manœuvre) permet notamment :",["De réarmer un disjoncteur ou manœuvrer un appareillage","De câbler une armoire","De consigner une installation"],0,"La manœuvre consiste à changer l'état électrique d'un réseau avec un appareil prévu pour."],
["Le recyclage de l'habilitation est recommandé :",["Tous les 3 ans","Tous les 10 ans","Jamais"],0,"La norme recommande un recyclage tous les 3 ans, à adapter par l'employeur."]
]},
{t:"La consignation électrique",q:[
["Première étape de la consignation :",["Séparer l'ouvrage de toute source d'énergie","Faire la VAT","Mettre à la terre"],0,"Les étapes : séparation, condamnation, identification, VAT, mise à la terre et en court-circuit."],
["La condamnation consiste à :",["Bloquer l'organe de séparation en position ouverte et le signaler","Retirer le câble","Prévenir le client"],0,"Cadenas plus étiquette : personne ne peut refermer par erreur."],
["VAT signifie :",["Vérification d'absence de tension","Valeur admissible de tension","Vanne d'arrêt technique"],0,"La VAT se fait sur chaque conducteur actif, au plus près du lieu de travail."],
["Le VAT (appareil) doit être testé :",["Avant et après la vérification","Une fois par an seulement","Jamais, il est fiable"],0,"On s'assure qu'il fonctionne avant, et qu'il n'est pas tombé en panne pendant la mesure."],
["Peut-on utiliser un multimètre à la place d'un VAT ?",["Non, il faut un VAT conforme","Oui, toujours","Oui, en BT"],0,"Un multimètre mal réglé (mauvais calibre) peut afficher 0 V sur un conducteur sous tension."],
["La mise à la terre et en court-circuit protège contre :",["Une réalimentation accidentelle ou une tension induite","Les chutes d'objets","Le bruit"],0,"Si la tension revient, le court-circuit fait déclencher la protection en amont."],
["L'étape d'identification sert à :",["S'assurer qu'on travaille bien sur l'ouvrage consigné","Repérer le fabricant","Noter l'heure"],0,"On vérifie sur place, avec le schéma et le repérage, que c'est le bon départ."],
["Qui réalise la consignation ?",["Le chargé de consignation (BC/HC)","N'importe quel intervenant","Le client"],0,"La consignation est confiée à une personne habilitée pour cela."],
["Appuyer sur le bouton « Arrêt » d'une machine suffit-il pour travailler dessus ?",["Non, un arrêt de commande n'est pas une séparation","Oui, si le voyant est éteint","Oui, si la machine est arrêtée"],0,"Un automate, un capteur ou un collègue peut relancer la machine. Il faut séparer et condamner."],
["L'attestation de consignation est remise :",["Au chargé de travaux","Au client seulement","À l'organisme de formation"],0,"Le chargé de travaux ne commence qu'avec l'attestation en main."]
]},
{t:"Voisinage et distances",q:[
["En BT, la distance limite de voisinage simple (DLVS) est de :",["0,30 m","3 m","10 cm"],0,"À moins de 0,30 m de pièces nues BT sous tension, on est en zone de voisinage."],
["Travailler à moins de 0,30 m de pièces nues BT sous tension demande :",["Une habilitation adaptée et des mesures de protection","Juste des gants de manutention","Rien de particulier"],0,"Il faut l'attribut V (voisinage) et des protections : nappes isolantes, écrans, EPI."],
["Avant de creuser près de réseaux enterrés, il faut :",["Faire une DT-DICT via le guichet unique","Creuser doucement à la pelle","Demander au voisin"],0,"La DT-DICT permet de connaître la position des réseaux avant les travaux."],
["Une ligne électrique est tombée au sol. Que faire ?",["Rester à distance et alerter","S'approcher pour la déplacer avec un bâton","La toucher avec des gants"],0,"Le sol autour peut être sous tension (tension de pas). Seul l'exploitant intervient."],
["La « tension de pas » est :",["La différence de tension entre les deux pieds près d'un défaut à la terre","La tension d'une marche d'escalier","La tension d'un moteur pas à pas"],0,"Plus les pieds sont écartés, plus la tension est élevée. On s'éloigne à petits pas."],
["Pour travailler près de pièces nues sous tension, on peut :",["Poser des protections isolantes (nappes, protecteurs)","Mettre du ruban adhésif","Travailler plus vite"],0,"Les protections isolantes empêchent le contact accidentel."],
["Une armoire électrique ouverte sous tension doit être :",["Balisée et réservée aux personnes habilitées","Laissée ouverte pour aérer","Fermée à clé avec quelqu'un dedans"],0,"Le balisage empêche un non-habilité d'approcher."],
["Le marquage d'un outil isolé pour travaux électriques est :",["Un double triangle avec « 1000 V »","Un logo CE seul","Une poignée rouge"],0,"La poignée colorée ne garantit pas l'isolation. Seul le marquage compte."],
["Bagues, montres et chaînes métalliques :",["Se retirent avant toute intervention électrique","Peuvent rester si elles sont fines","Protègent du courant"],0,"Le métal peut créer un court-circuit et provoquer de graves brûlures."],
["Près de conducteurs sous tension, une échelle métallique :",["Est interdite, on prend une échelle isolante","Est conseillée car solide","Est autorisée avec des gants"],0,"Une échelle métallique conduit le courant."]
]},
{t:"Les EPI électriques",q:[
["Les gants isolants de classe 0 protègent jusqu'à :",["1 000 V en alternatif","500 V","50 V"],0,"Classe 00 : 500 V. Classe 0 : 1 000 V."],
["Avant chaque utilisation, les gants isolants doivent :",["Être vérifiés visuellement et par gonflage","Être lavés","Être mouillés"],0,"Le gonflage révèle les micro-trous invisibles à l'œil."],
["L'écran facial anti-arc sert à :",["Protéger le visage et les yeux de l'arc électrique","Protéger du bruit","Respirer"],0,"Il filtre les UV et protège des projections de métal fondu."],
["Sous la tenue de travail électrique, on évite :",["Les vêtements synthétiques","Le coton","Les vêtements ignifugés"],0,"Le synthétique fond et colle à la peau en cas d'arc."],
["Les gants isolants se rangent :",["Dans leur housse, à l'abri de la lumière et de la chaleur","Pliés dans la poche","Au fond de la caisse à outils"],0,"UV, chaleur et pliures abîment le caoutchouc."],
["Porter des surgants en cuir par-dessus les gants isolants :",["Protège les gants isolants des coupures","Est interdit","Ne sert à rien"],0,"Les surgants évitent d'abîmer l'isolant pendant l'intervention."],
["Un tapis isolant sert à :",["Isoler l'opérateur du sol","Protéger le sol","Ranger les outils"],0,"Il empêche le courant de traverser le corps vers la terre."],
["Le casque pour travaux électriques doit être :",["Isolant, sans parties métalliques","En métal pour être solide","Percé pour l'aération"],0,"Un casque percé ou métallique ne protège pas du contact électrique."],
["Gants isolants dont la date de contrôle périodique est dépassée :",["Ne pas les utiliser","Les utiliser une dernière fois","Les utiliser en BT seulement"],0,"On ne peut plus garantir leur isolement."],
["Un gant isolant présente une petite coupure :",["Il est mis au rebut immédiatement","On le répare avec du ruban","On le garde pour la TBT"],0,"La moindre coupure annule la protection."]
]},
{t:"Matériel et installations",q:[
["Dans un indice IP (ex. IP54), le second chiffre indique :",["La protection contre l'eau","La protection contre les chocs","La puissance"],0,"Premier chiffre : solides et poussières. Second chiffre : eau."],
["Le symbole « double carré » signifie :",["Appareil de classe II, double isolation","Appareil à relier à la terre","Appareil étanche"],0,"Un appareil de classe II ne se raccorde pas à la terre."],

T.push({id:"hauteur",name:"Travail en hauteur",sign:"tri",glyph:"⇣",tests:[
{t:"Les principes",q:[
["En travail en hauteur, la priorité va à :",["La protection collective","Le harnais","La prudence de chacun"],0,"Garde-corps, filets, plateformes protègent tout le monde sans action de l'intervenant."],
["Le risque de chute de hauteur existe :",["Dès qu'il y a une différence de niveau","Seulement au-dessus de 3 m","Seulement au-dessus de 10 m"],0,"Le Code du travail ne fixe pas de hauteur minimale."],
["Un garde-corps mesure en hauteur :",["Entre 1 m et 1,10 m","50 cm","2 m"],0,"Il doit résister à la poussée d'une personne."],
["Un garde-corps complet comprend :",["Une lisse, une sous-lisse et une plinthe","Une seule barre","Un ruban de balisage"],0,"La sous-lisse évite de passer dessous, la plinthe arrête pieds et objets."],
["La plinthe sert à :",["Empêcher la chute d'objets et le glissement des pieds","Décorer","S'asseoir"],0,"Elle mesure au moins 10 à 15 cm de haut."],
["Une échelle comme poste de travail est :",["Interdite, sauf impossibilité, pour des travaux courts et non répétitifs","Toujours autorisée","Conseillée"],0,"L'échelle est d'abord un moyen d'accès."],
["Le harnais s'utilise :",["Quand la protection collective est impossible","Toujours à la place des garde-corps","Jamais"],0,"C'est une protection individuelle, en dernier recours."],
["Pour utiliser un équipement antichute, il faut :",["Avoir été formé","Avoir plus de 30 ans","Aucune formation"],0,"Mal utilisé, un harnais peut ne pas arrêter la chute."],
["Sur une toiture fragile, on travaille :",["Seulement avec des protections (filets, platelages, garde-corps)","En marchant sur les plaques","Seul et vite"],0,"Les chutes à travers les toitures sont parmi les plus mortelles."],
["Vent fort, pluie ou verglas :",["On suspend le travail en hauteur","On accélère","On retire le harnais"],0,"Les conditions météo augmentent fortement le risque de chute."]
]},
{t:"Harnais et antichute",q:[
["Le point d'ancrage d'un antichute se situe de préférence :",["Au-dessus de l'utilisateur","Aux pieds","Sur un tuyau quelconque"],0,"Plus il est haut, plus la chute est courte."],
["Sur un harnais, les points d'accrochage antichute sont marqués :",["A","X","Z"],0,"Seuls les anneaux marqués A arrêtent une chute."],
["L'absorbeur d'énergie sert à :",["Réduire le choc sur le corps à l'arrêt de la chute","Raccourcir la longe","Remplacer l'ancrage"],0,"Sans absorbeur, le choc peut causer des lésions graves."],
["Le tirant d'air est :",["La hauteur libre nécessaire sous l'utilisateur pour arrêter la chute sans heurter le sol","La ventilation du harnais","La longueur de la longe"],0,"Avec une longe à absorbeur, il faut souvent plus de 5 m."],
["Une longe antichute avec absorbeur mesure au maximum :",["2 m","5 m","10 m"],0,"Au-delà, la chute serait trop longue."],
["Après avoir arrêté une chute, le harnais et la longe :",["Sont retirés du service","Sont réutilisés","Sont lavés et rangés"],0,"Ils ont pu être abîmés sans que ça se voie."],
["Les EPI antichute sont vérifiés par une personne compétente :",["Au moins une fois par an","Tous les 10 ans","Jamais"],0,"La date du dernier contrôle est notée."],
["Avant chaque utilisation, le harnais :",["Fait l'objet d'un contrôle visuel","N'est pas vérifié","Est mouillé"],0,"Coutures, sangles, boucles, étiquettes lisibles."],
["Un harnais bien réglé :",["Est ajusté, les cuissardes serrées (passage d'une main à plat)","Est lâche pour être confortable","Se porte sans cuissardes"],0,"Trop lâche, on peut glisser hors du harnais."],
["Un antichute à rappel automatique :",["S'accroche au-dessus et se teste en tirant d'un coup sec","S'accroche au sol","Ne se vérifie pas"],0,"Il doit bloquer net au test."]

{t:"Suspension et secours",q:[

["Le plan de secours d'une personne suspendue :",["Est prévu avant de commencer le travail","Est improvisé","N'est pas nécessaire"],0,"Attendre l'arrivée des pompiers peut être trop long."],

["Travailler seul en hauteur avec un harnais :",["Est à éviter : personne pour secourir","Est conseillé","Ne pose aucun problème"],0,"Le secours doit pouvoir être immédiat."],
["Le kit de sauvetage sur place sert à :",["Évacuer rapidement une personne suspendue","Réparer le harnais","Rien"],0,"Il permet de redescendre ou remonter la victime."],
["Le numéro d'urgence européen est :",["112","17","118"],0,"Il fonctionne depuis tout téléphone dans l'Union européenne."],
["Le secours d'une personne suspendue doit se faire :",["Le plus vite possible, en quelques minutes","Dans la journée","Après le repas"],0,"Le temps est le facteur clé."],
["Compter uniquement sur les pompiers pour secourir une personne suspendue :",["N'est pas suffisant, des moyens sur place sont nécessaires","Est la bonne solution","Est obligatoire"],0,"Leur délai d'arrivée peut dépasser le temps critique."],
["Après une chute arrêtée par le harnais :",["On consulte un médecin, même sans douleur","On continue le travail","On ne dit rien"],0,"Le choc peut provoquer des lésions internes."]

{t:"Échelles et escabeaux",q:[
["Une échelle simple s'incline à environ :",["75° (pied écarté du quart de la hauteur)","45°","90°"],0,"Trop droite, elle bascule. Trop couchée, elle glisse."],
["Pour accéder à un niveau, l'échelle dépasse :",["D'au moins 1 m","De 10 cm","Pas du tout"],0,"On a ainsi une prise pour descendre et monter."],

["Une échelle en bois peinte :",["Est à éviter : la peinture cache les défauts","Est plus solide","Est conseillée"],0,"Fissures et pourriture deviennent invisibles."],
["Sur une échelle, on se penche :",["En gardant le nombril entre les montants","Le plus loin possible","Avec une main"],0,"Au-delà, l'échelle bascule."],
["Sur une échelle, il y a :",["Une seule personne à la fois","Deux personnes si elle est solide","Autant qu'on veut"],0,"L'échelle est conçue pour une personne."],
["Une échelle devant une porte :",["La porte est bloquée ou la zone balisée","On ne fait rien","On compte sur les autres"],0,"Quelqu'un qui ouvre la porte fait tomber l'échelle."]
]},
{t:"Nacelles PEMP",q:[

["Avant de commencer, l'opérateur de nacelle :",["Fait une vérification de prise de poste","Démarre directement","Vérifie seulement le carburant"],0,"Commandes, arrêt d'urgence, pneus, fuites, alarmes."],

["En cas de vent, on respecte :",["La vitesse maximale indiquée par le constructeur","Son ressenti","Rien"],0,"Au-delà, la nacelle peut basculer."],

["Une personne au sol :",["Doit savoir utiliser les commandes de secours","N'a rien à faire","Peut partir"],0,"Elle peut redescendre l'opérateur en cas de malaise."],
["Monter sur le garde-corps de la nacelle pour gagner de la hauteur :",["Est interdit","Est autorisé avec harnais","Est autorisé si c'est rapide"],0,"On choisit une nacelle de hauteur suffisante."]

{t:"Échafaudages",q:[

{t:"Toitures et trémies",q:[

["Un groupe froid installé en toiture :",["Doit avoir un accès et une zone de travail sécurisés","S'atteint par la gouttière","N'a pas besoin d'accès"],0,"Le dépannage ne doit pas obliger à prendre des risques."],
["Une crinoline sur une échelle fixe :",["Limite le risque mais n'arrête pas une chute comme un antichute","Arrête toutes les chutes","Remplace le harnais"],0,"Une chute dans la crinoline peut quand même blesser gravement."]

{t:"Chutes d'objets et coactivité",q:[
["Sous une zone de travail en hauteur, on porte :",["Un casque","Une casquette","Rien"],0,"Le casque protège des chutes d'objets."],

["Jeter des objets ou gravats depuis la hauteur :",["Est interdit, on utilise une goulotte ou un moyen de descente","Est autorisé si on crie","Est autorisé le soir"],0,"Les gravats peuvent rebondir loin."],

{t:"Vrai ou faux hauteur",q:[

{t:"Révision travail en hauteur",q:[

["L'ancrage d'un harnais sur une tuyauterie quelconque :",["Est interdit si sa résistance n'est pas connue","Est conseillé","Est toujours sûr"],0,"Le point d'ancrage doit résister au choc d'une chute."],

]}

T.push({id:"epi",name:"Port des EPI",sign:"circ",glyph:"⛑",tests:[
{t:"Les principes des EPI",q:[

["Les EPI interviennent :",["En complément, quand le risque ne peut pas être supprimé autrement","En premier, avant toute autre mesure","Jamais"],0,"On supprime d'abord le risque, puis on protège collectivement, puis individuellement."],
["Les EPI sont fournis :",["Gratuitement par l'employeur","Par le salarié","Par le client"],0,"L'employeur fournit, entretient et remplace les EPI."],
["Un EPI conforme porte :",["Le marquage CE","Un logo de couleur","Le nom du salarié"],0,"Le marquage CE atteste qu'il respecte les exigences européennes."],

["Le salarié est formé au port d'un EPI :",["Quand c'est nécessaire, notamment pour les EPI de catégorie III","Jamais","Seulement s'il le demande"],0,"Harnais et ARI exigent un entraînement."]

{t:"Tête et pieds",q:[

["Des chaussures de sécurité usées :",["Sont remplacées","Sont gardées jusqu'au trou","Sont recollées"],0,"Une semelle lisse fait glisser."],
["Dans les zones à risque électrique, les chaussures :",["Sont adaptées (isolantes, sans parties métalliques apparentes)","Sont quelconques","Sont des bottes en caoutchouc percées"],0,"On choisit le modèle adapté au risque."]

{t:"Yeux et visage",q:[

{t:"Protection auditive",q:[

["Un bouchon d'oreille en mousse se met :",["Roulé, puis inséré profondément en tirant le haut de l'oreille","Juste posé à l'entrée","Mouillé"],0,"Mal mis, il protège très peu."],
["Retirer ses protections quelques minutes dans le bruit :",["Fait perdre une grande partie de la protection","N'a pas d'effet","Repose l'oreille"],0,"Le bruit reçu pendant ces minutes s'additionne vite."],
["Un sifflement dans les oreilles après le travail :",["Est un signe d'alerte","Est normal","Est sans importance"],0,"On en parle au médecin du travail."],

["Si on doit élever la voix pour parler à 1 m :",["Le bruit est probablement dangereux","Tout va bien","On parle plus fort"],0,"C'est un repère simple d'un niveau supérieur à 80 dB(A)."],

{t:"Protection des mains",q:[

["Les gants contre les produits chimiques portent le marquage :",["EN 374","EN 388","EN 397"],0,"Le choix dépend du produit manipulé (voir la FDS)."],

["Pour retirer des gants souillés de produit chimique :",["On les retire sans toucher l'extérieur avec la peau","On les tire avec les dents","On les garde pour la pause"],0,"On évite de se contaminer en les retirant."],

["Se laver les mains après avoir porté des gants :",["Reste nécessaire","Est inutile","Est interdit"],0,"Des traces de produit peuvent rester."]

{t:"Protection respiratoire",q:[

["Un filtre de couleur blanche (type P) protège contre :",["Les particules","Les gaz acides","L'ammoniac"],0,"P1, P2, P3 selon l'efficacité."],
["Dans un espace où l'oxygène manque, on utilise :",["Un appareil respiratoire isolant (ARI)","Un masque à cartouche","Un masque FFP3"],0,"Un filtre ne fabrique pas d'oxygène."],

["Pour des travaux exposant à l'amiante, on utilise au minimum :",["Une protection respiratoire adaptée (P3 ou mieux, selon l'activité)","Un masque en papier","Rien"],0,"Les fibres d'amiante provoquent des cancers."],
["Un masque FFP jetable :",["Se jette après la durée d'usage indiquée","Se garde une semaine","Se lave"],0,"Il se colmate et s'humidifie."]

{t:"Vêtements de travail",q:[

["Des vêtements amples près d'une machine tournante :",["Peuvent être happés","Sont conseillés","Sont sans risque"],0,"Manches, écharpes et cheveux longs sont attachés."],

["Les vêtements de travail sales :",["Ne sont pas lavés avec le linge familial s'ils sont contaminés","Sont lavés avec tout","Ne sont jamais lavés"],0,"On évite de ramener des produits ou fibres à la maison."],

["Une combinaison jetable de type 5/6 protège contre :",["Les poussières et légères éclaboussures","Le feu","L'électricité"],0,"Utilisée par exemple pour les travaux poussiéreux."],
["Les bijoux, montres et alliances en atelier :",["Sont retirés près des machines et en électricité","Sont gardés","Protègent la peau"],0,"Ils peuvent être happés ou conduire le courant."],
["Le vêtement contre l'arc électrique :",["Est non propagateur de flamme","Est en nylon","Est un simple tee-shirt"],0,"Il limite les brûlures en cas d'arc."]
]},
{t:"Entretien et contrôle",q:[

["Les EPI antichute sont vérifiés par une personne compétente :",["Au moins une fois par an","Tous les 5 ans","Jamais"],0,"Le contrôle est noté dans un registre."],
["Les EPI se rangent :",["Propres, à l'abri de la chaleur, de l'humidité et des UV","Dans le coffre du véhicule en plein soleil","Par terre"],0,"Un mauvais stockage les abîme."],

["Constater qu'un EPI manque pour un travail dangereux :",["On ne commence pas et on le signale","On commence quand même","On improvise"],0,"Le travail attend que la protection soit disponible."],
["Un EPI modifié par l'utilisateur (sangle coupée, casque percé) :",["N'est plus conforme","Est amélioré","Est autorisé"],0,"Toute modification annule la conformité."]
]},

["Les énergies à consigner peuvent être :",["Électrique, mécanique, hydraulique, pneumatique, thermique, chimique","Seulement électrique","Seulement la vapeur"],0,"Toutes les énergies dangereuses doivent être identifiées."],
["Les grandes étapes d'une consignation sont :",["Séparer, condamner, dissiper, vérifier","Arrêter, partir, revenir","Couper, attendre, intervenir"],0,"On vérifie ensuite l'absence d'énergie au point d'intervention."],
["L'énergie résiduelle, c'est :",["L'énergie qui reste après la coupure (pression, ressort, condensateur, pièce en hauteur)","Une énergie qui n'existe pas","La facture d'électricité"],0,"Elle doit être dissipée ou bloquée."],

["La déconsignation se fait :",["Quand tout le monde a terminé et a quitté la zone","Quand le client le demande","Dès qu'un intervenant a fini"],0,"On vérifie que la zone est libre et l'installation remontée."],
["Une procédure de consignation écrite :",["Est nécessaire pour les installations complexes","Est inutile","Est réservée aux électriciens"],0,"Elle liste chaque point d'isolement."],

["Consigner prend du temps, donc on peut s'en passer pour une intervention rapide :",["Faux, la durée ne change pas le danger","Vrai","Vrai si on est expérimenté"],0,"Beaucoup d'accidents graves arrivent lors d'interventions « rapides »."]
]},
{t:"Cadenas et étiquettes",q:[

["Le moraillon (pince multi-cadenas) sert à :",["Poser plusieurs cadenas sur un même organe","Couper un cadenas","Ouvrir une vanne"],0,"L'organe reste bloqué tant qu'un seul cadenas est en place."],

["Un intervenant est parti en oubliant son cadenas :",["On applique la procédure de retrait exceptionnel (vérification, autorisation, information)","On coupe le cadenas","On attend le lendemain sans prévenir"],0,"On s'assure d'abord qu'il n'est plus sur l'installation."],
["Le boîtier de consignation collective sert à :",["Regrouper les clés des cadenas d'isolement, sur lequel chaque intervenant pose son cadenas","Ranger les outils","Stocker les étiquettes"],0,"Pratique quand il y a de nombreux points d'isolement."],
["Un dispositif de condamnation pour disjoncteur ou vanne quart de tour :",["Permet de poser un cadenas sur un organe qui n'est pas prévu pour","Est décoratif","Est interdit"],0,"Il existe des dispositifs pour chaque type d'organe."]

{t:"Énergies mécaniques",q:[

{t:"Situations de terrain",q:[

["Ton cadenas ne passe pas sur l'organe de séparation :",["Tu utilises un dispositif de condamnation adapté","Tu poses juste une étiquette","Tu tiens le levier"],0,"Il existe des dispositifs pour chaque organe."],
["Un collègue enlève son cadenas pour aller chercher une pièce, tu restes dans la machine :",["Ton propre cadenas te protège toujours","Tu es en danger","Tu dois sortir"],0,"C'est pourquoi chacun pose son cadenas."],

{t:"Machines et automatismes",q:[

["Un robot ou manipulateur à l'arrêt :",["N'est approché qu'après consignation selon la procédure","Peut être approché librement","Est sans danger s'il est éteint à l'écran"],0,"Il peut repartir brutalement."],

T.push({id:"confine",name:"Espaces confinés et ATEX",sign:"tri",glyph:"EX",tests:[
{t:"Reconnaître un espace confiné",q:[
["Un espace confiné, c'est par exemple :",["Une cuve, une fosse, un regard, une galerie technique","Un bureau climatisé","Un parking à ciel ouvert"],0,"Espace clos ou partiellement clos, mal ventilé, où l'atmosphère peut devenir dangereuse."],
["Le principal danger d'un espace confiné est :",["L'atmosphère (manque d'oxygène, gaz toxiques ou explosifs)","Le bruit","La lumière"],0,"On peut perdre connaissance en quelques respirations."],
["En France, la formation pour intervenir en espace confiné (eau et assainissement) s'appelle :",["CATEC","CACES","SST"],0,"CATEC : Certificat d'aptitude à travailler en espaces confinés."],
["Avant d'entrer dans un espace confiné, on mesure :",["L'oxygène, les gaz toxiques et l'explosivité","La température seulement","Rien si ça ne sent pas"],0,"Beaucoup de gaz dangereux sont inodores."],
["La mesure de l'atmosphère se fait :",["Avant d'entrer et en continu pendant l'intervention","Seulement à l'entrée","Seulement à la sortie"],0,"L'atmosphère peut changer pendant le travail."],
["Un surveillant reste à l'extérieur :",["Pendant toute la durée de l'intervention","Seulement au début","Jamais"],0,"Il donne l'alerte et ne doit pas entrer sans protection."],

["Un regard d'égout qui « ne sent rien » :",["Peut quand même contenir un gaz mortel","Est forcément sans danger","Peut être visité sans mesure"],0,"Le CO2 et le CO sont inodores. Le H2S endort l'odorat."],
["Le permis d'entrée en espace confiné :",["Formalise les mesures, les autorisations et les moyens de secours","Est inutile","Remplace la mesure de gaz"],0,"Il est signé avant l'entrée."],
["Le foyer d'une chaudière ou l'intérieur d'un ballon est :",["Un espace confiné","Un local de travail normal","Un espace extérieur"],0,"On applique les mêmes règles."]

{t:"L'atmosphère dangereuse",q:[

["Trop d'oxygène (au-dessus de 23 %) :",["Augmente fortement le risque d'incendie","Est bon pour la santé","N'a pas d'effet"],0,"Les vêtements peuvent s'enflammer très facilement."],

["La LIE (limite inférieure d'explosivité) est :",["La concentration minimale d'un gaz pour qu'il puisse exploser","La température d'un gaz","Le volume d'un réservoir"],0,"Le détecteur affiche un pourcentage de la LIE."],

["Certains gaz plus lourds que l'air (CO2, propane, H2S) :",["S'accumulent dans les fonds","Montent au plafond","Disparaissent"],0,"On mesure à plusieurs hauteurs, surtout en bas."]
]},
{t:"Secours en espace confiné",q:[
["Un collègue s'effondre au fond d'une cuve :",["On ne descend pas sans appareil respiratoire : on alerte","On descend tout de suite le chercher","On lui lance de l'eau"],0,"La majorité des morts en espace confiné sont des sauveteurs."],
["Le surveillant extérieur :",["Alerte les secours et utilise les moyens de récupération sans entrer","Entre aider","Part chercher du matériel loin"],0,"Il ne doit jamais devenir une deuxième victime."],
["Le harnais avec treuil de récupération sert à :",["Remonter la victime sans entrer","Descendre plus vite","Rien"],0,"Il est prévu avant l'entrée."],

["L'appareil d'évacuation (masque auto-sauveteur) sert à :",["Sortir rapidement en cas de problème","Travailler longtemps","Remplacer la ventilation"],0,"Son autonomie est courte."],
["Le plan de secours précise :",["Qui alerte, comment on récupère la victime, les numéros d'urgence","Seulement le nom du chef","Rien"],0,"Il est préparé avant l'intervention."],

["Après un incident en espace confiné, même sans blessé :",["On le signale pour analyser et éviter qu'il se reproduise","On n'en parle pas","On recommence"],0,"Les presque-accidents permettent de prévenir les accidents."]
]},
{t:"Zones ATEX",q:[

["Une zone 0 (gaz) est une zone où l'atmosphère explosive est :",["Présente en permanence ou longtemps","Rare","Jamais présente"],0,"Zone 0 permanent, zone 1 occasionnel, zone 2 rare et de courte durée."],
["Les zones 20, 21 et 22 concernent :",["Les poussières","Les gaz","L'eau"],0,"Farines, sucre, bois, poudres métalliques..."],

["Un téléphone portable standard en zone ATEX :",["Est interdit","Est autorisé","Est conseillé"],0,"Il peut provoquer une étincelle."],
["Les poussières combustibles déposées :",["Peuvent exploser si elles sont mises en suspension","Sont sans danger","Protègent du feu"],0,"Une première explosion soulève les poussières et en provoque une seconde, plus violente."],

["Travailler par point chaud dans une zone ATEX :",["Demande un permis de feu et l'absence d'atmosphère explosive mesurée","Est autorisé librement","Est toujours interdit sans exception"],0,"La zone est d'abord rendue non dangereuse et contrôlée."],
["Le DRPCE (document relatif à la protection contre les explosions) :",["Est établi par l'employeur pour les zones ATEX","N'existe pas","Concerne les échelles"],0,"Il définit le zonage et les mesures de prévention."]

{t:"Sources d'inflammation",q:[

{t:"Préparer une intervention",q:[
["Avant d'entrer dans une cuve, on la :",["Vide, nettoie, isole (joints pleins, consignation) et ventile","Remplit d'eau","Ferme"],0,"L'isolement évite l'arrivée de produit pendant l'intervention."],

{t:"Gaz et produits courants",q:[

{t:"Amiante",q:[

{t:"Brûlures et électrisation",q:[

["Les vêtements collés à une brûlure :",["Ne sont pas arrachés","Sont arrachés vite","Sont découpés à la brûlure"],0,"On refroidit par-dessus et on attend les secours."],
["Une brûlure grave est par exemple :",["Une brûlure plus grande que la moitié de la paume de la victime","Un petit rougissement","Une brûlure de 1 mm"],0,"Ou une brûlure au visage, aux mains, aux articulations."],
["Les cloques d'une brûlure :",["Ne sont pas percées","Sont percées","Sont arrachées"],0,"La cloque protège contre l'infection."],
["Une personne électrisée toujours en contact avec le courant :",["On coupe le courant avant de la toucher","On la tire","On lui donne la main"],0,"Le sauveteur serait électrisé à son tour."],
["Après une électrisation, même si la victime va bien :",["Elle consulte un médecin","Elle reprend le travail","Elle rentre chez elle seule"],0,"Des troubles cardiaques peuvent apparaître plus tard."],
["Une brûlure électrique :",["Peut cacher des lésions internes graves","Est toujours superficielle","Ne nécessite rien"],0,"Le courant brûle en profondeur sur son trajet."],
["Une personne en feu :",["On l'empêche de courir et on étouffe les flammes (couverture, roulade au sol)","On la laisse courir","On l'arrose d'huile"],0,"Courir attise les flammes."],
["Une brûlure par produit chimique :",["Est rincée longuement à l'eau","Est couverte de crème","Est séchée"],0,"On retire les vêtements souillés."],
["Une victime brûlée sur une grande surface :",["Est couverte (couverture de survie) après refroidissement et on alerte","Est laissée découverte","Est mise sous la douche froide 1 heure"],0,"Le risque d'hypothermie est important."]
]},
{t:"Prévention incendie au quotidien",q:[
["Les chiffons gras et imbibés de solvant :",["Vont dans un récipient métallique fermé","Restent en tas","Vont à la poubelle papier"],0,"Ils peuvent s'enflammer seuls."],
["Les prises multiples en cascade :",["Sont à éviter : risque de surchauffe","Sont pratiques","Sont conseillées"],0,"La surcharge peut faire fondre les prises."],
["Fumer sur un site industriel :",["Se fait uniquement aux emplacements autorisés","Partout","Dans les locaux techniques"],0,"Les mégots sont une cause fréquente d'incendie."],
["Les déchets combustibles (cartons, emballages) :",["Sont évacués régulièrement","Sont accumulés dans les chaufferies","Sont brûlés sur place"],0,"Une chaufferie n'est pas un lieu de stockage."],
["Un local électrique :",["Ne sert pas de stockage","Sert de débarras","Sert de vestiaire"],0,"Les matériaux combustibles alimentent un départ de feu."],
["Les portes coupe-feu :",["Restent fermées ou se ferment automatiquement","Sont calées ouvertes","Sont retirées"],0,"Elles empêchent la propagation du feu et des fumées."],
["Les batteries lithium endommagées :",["Sont isolées : risque d'incendie","Sont rechargées","Sont percées"],0,"Elles peuvent s'enflammer violemment."],
["Le stockage de bouteilles de gaz :",["Se fait à l'extérieur ou en local ventilé dédié","Dans le bureau","Près d'un radiateur"],0,"Une fuite ne doit pas s'accumuler."],
["L'accès aux extincteurs :",["Reste dégagé","Peut être encombré","Est fermé à clé"],0,"Il faut pouvoir les prendre en quelques secondes."],
["Signaler un défaut (câble chauffé, odeur de brûlé) :",["Tout de suite","À la fin de la semaine","Jamais"],0,"Beaucoup d'incendies commencent par un petit signe."]
]},
{t:"Situations de terrain",q:[
["Départ de feu sur une armoire électrique :",["Couper l'alimentation si possible, extincteur CO2, alerter","Jet d'eau","Ouvrir l'armoire"],0,"Jamais d'eau sur un équipement sous tension."],
["Feu sur une poêle d'huile au réfectoire :",["Couper le feu et couvrir avec un couvercle ou une couverture anti-feu","Verser de l'eau","Souffler"],0,"L'eau sur l'huile provoque une explosion de flammes."],
["Feu qui grandit malgré l'extincteur :",["On évacue, on ferme la porte et on alerte","On continue seul","On cherche un autre extincteur pendant 10 minutes"],0,"On ne met pas sa vie en danger."],
["Fuite de gaz enflammée sur une conduite :",["On coupe la vanne de gaz si possible, sans éteindre la flamme avant","On éteint la flamme d'abord","On souffle dessus"],0,"Si la flamme s'éteint et que le gaz fuit encore, il peut exploser plus loin."],
["Un collègue fait un malaise en chaufferie :",["Vérifier qu'il n'y a pas de CO, protéger, alerter, secourir","Le secouer","Le laisser"],0,"La cause peut aussi menacer le sauveteur."],
["Un collègue se coupe profondément la main :",["Appui direct sur la plaie, alerte","On lui donne un pansement et il continue","On rince et on attend"],0,"On allonge la victime si elle pâlit."],
["Un collègue reçoit un éclat dans l'œil en meulant :",["On ne retire pas l'éclat, on couvre les deux yeux et on consulte","On le retire avec une pince","On frotte"],0,"Couvrir les deux yeux limite les mouvements de l'œil blessé."],
["Une victime d'électrisation est inconsciente et respire :",["PLS et alerte","On la met debout","On lui donne à boire"],0,"On surveille sa respiration en attendant les secours."],
["Tu es seul sur un site et tu te blesses :",["Tu utilises ton téléphone ou ton dispositif d'alarme pour alerter","Tu attends le lendemain","Tu conduis jusqu'à l'hôpital même en état de choc"],0,"Le travailleur isolé doit toujours pouvoir alerter."],
["Le défibrillateur du site :",["Doit être repéré à l'arrivée sur site","Est inutile","Est réservé aux médecins"],0,"Chaque minute compte en cas d'arrêt cardiaque."]
]},
{t:"Vrai ou faux incendie et secours",q:[
["On peut éteindre un feu de friteuse avec de l'eau.",VF,1,"Faux. Cela provoque une projection d'huile enflammée."],
["Le CO2 est adapté aux feux d'origine électrique.",VF,0,"Vrai. Il ne conduit pas le courant et ne laisse pas de résidu."],
["En cas d'incendie, on prend l'ascenseur pour sortir plus vite.",VF,1,"Faux. Il peut se bloquer."],
["Le 112 fonctionne dans toute l'Union européenne.",VF,0,"Vrai. C'est le numéro d'urgence européen."],
["On perce les cloques d'une brûlure.",VF,1,"Faux. Elles protègent la plaie."],
["Tout le monde peut utiliser un défibrillateur automatisé.",VF,0,"Vrai. Il guide l'utilisateur par la voix."],
["Les fumées sont la principale cause de décès dans les incendies.",VF,0,"Vrai. Elles sont toxiques et asphyxiantes."],
["On peut toucher une victime électrisée sans couper le courant si on a des gants de travail.",VF,1,"Faux. On coupe le courant d'abord."],
["Après un travail par point chaud, on peut partir immédiatement.",VF,1,"Faux. Une surveillance est maintenue."],
["Une porte coupe-feu peut être calée ouverte pour faciliter le passage.",VF,1,"Faux. Elle doit pouvoir se fermer pour bloquer le feu."]
]},
{t:"Révision incendie et secours",q:[
["Le triangle du feu comprend :",["Combustible, comburant, énergie","Eau, terre, air","Flamme, fumée, cendres"],0,"On éteint en supprimant un élément."],
["Le premier geste face à un accident :",["Protéger","Secourir","Partir"],0,"Il évite un sur-accident."],
["Les numéros d'urgence à connaître :",["15, 17, 18 et 112","10, 20, 30","911 uniquement"],0,"Le 911 n'est pas le numéro français."],
["L'extincteur adapté à un feu de solvant :",["Poudre, mousse ou CO2","Eau seule en jet","Sable mouillé"],0,"L'eau en jet étale le liquide en feu."],
["Une victime qui ne respire pas :",["Massage cardiaque et défibrillateur","PLS","Rien"],0,"La PLS est réservée à la victime qui respire."],
["Le refroidissement d'une brûlure dure :",["Environ 15 minutes","1 minute","1 heure"],0,"Avec de l'eau tempérée."],
["Le point de rassemblement :",["Permet de compter les personnes évacuées","Est facultatif","Est à l'intérieur"],0,"On y reste jusqu'aux instructions."],
["Le permis de feu concerne :",["Les travaux par point chaud","Les travaux de bureau","Les livraisons"],0,"Soudage, meulage, découpe..."],
["Une personne inconsciente qui respire est placée :",["En position latérale de sécurité","Assise","Debout"],0,"Pour que ses voies respiratoires restent libres."],
["Un SST est formé à :",["Porter secours et participer à la prévention","Éteindre tous les feux","Soigner comme un médecin"],0,"Le recyclage est régulier."]
]}
]});

</script>
<script>
(function(){
const LOGO=`<svg class="sign" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 57 11v19c0 16-11 27-25 31C18 57 7 46 7 30V11Z" fill="#F2B300"/><path d="M32 8 52 14.5V30c0 13-8.6 22-20 25.6C20.6 52 12 43 12 30V14.5Z" fill="#15181C"/><path d="M19 38c0-9.5 5.8-15.5 13-15.5S45 28.5 45 38Z" fill="#F2B300"/><rect x="15" y="37" width="34" height="5" rx="2.5" fill="#F2B300"/><rect x="30" y="22" width="4" height="10" rx="1" fill="#15181C"/><path d="m24 47 5 4.5 11-10" fill="none" stroke="#F2B300" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON={
 elec:`<path d="M34 16 22 36h9l-3 14 13-21h-9l2-13Z" fill="#15181C"/>`,
 froid:`<g stroke="#15181C" stroke-width="3" stroke-linecap="round" fill="none"><path d="M32 20v28M20 27l24 14M44 27 20 41"/><path d="m28 21 4 3 4-3M28 47l4-3 4 3"/></g>`,
 vapeur:`<g stroke="#15181C" stroke-width="3" stroke-linecap="round" fill="none"><path d="M24 46c-3-4 3-6 0-10s3-6 0-10"/><path d="M32 46c-3-4 3-6 0-10s3-6 0-10"/><path d="M40 46c-3-4 3-6 0-10s3-6 0-10"/></g>`,
 hauteur:`<g stroke="#15181C" stroke-width="3" stroke-linecap="round" fill="none"><path d="M25 20v28M39 20v28M25 27h14M25 34h14M25 41h14"/></g>`,
 epi:`<path d="M19 38c0-9 5.8-15 13-15s13 6 13 15Z" fill="#fff"/><rect x="15" y="37" width="34" height="5" rx="2.5" fill="#fff"/><rect x="30" y="23" width="4" height="9" rx="1" fill="#1E5DA6"/>`,
 consign:`<rect x="21" y="30" width="22" height="18" rx="3" fill="#fff"/><path d="M25 30v-5a7 7 0 0 1 14 0v5" fill="none" stroke="#fff" stroke-width="3.5"/><circle cx="32" cy="38" r="2.6" fill="#1E5DA6"/><rect x="31" y="39" width="2" height="5" fill="#1E5DA6"/>`,
 confine:`<text x="32" y="46" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="17" fill="#15181C">EX</text>`,
 chimique:`<path d="M28 16h8M29 16v10l-9 17a3 3 0 0 0 2.7 4.5h18.6A3 3 0 0 0 44 43l-9-17V16" fill="none" stroke="#15181C" stroke-width="3" stroke-linejoin="round"/><path d="M24 38h16l3 5.5H21Z" fill="#15181C"/>`,
 levage:`<g fill="none" stroke="#15181C" stroke-width="3.4" stroke-linecap="round"><path d="M32 16v14"/><path d="M32 30c-5 0-8 4-8 8s3 8 8 8 8-4 8-8"/></g><rect x="28" y="13" width="8" height="5" rx="1" fill="#15181C"/>`,
 incendie:`<path d="M32 15c3 7 11 11 11 21a11 11 0 0 1-22 0c0-5 3-8 5-10 0 4 2 6 4 6-2-6 0-12 2-17Z" fill="#fff"/>`
};
function sign(th,cls){
  const ic=ICON[th.id]||"";let shape="";
  if(th.sign==="tri") shape=`<path d="M32 5 61 56H3Z" fill="#F2B300" stroke="#15181C" stroke-width="4" stroke-linejoin="round"/>`;
  else if(th.sign==="circ") shape=`<circle cx="32" cy="32" r="29" fill="#1E5DA6"/>`;
  else if(th.sign==="losange") shape=`<path d="M32 3 61 32 32 61 3 32Z" fill="#fff" stroke="#C42A26" stroke-width="4.5" stroke-linejoin="round"/>`;
  else shape=`<rect x="4" y="4" width="56" height="56" rx="6" fill="#C42A26"/>`;
  const shift=th.sign==="tri"?' transform="translate(0 5) scale(.86) translate(5.2 2)"':'';
  return `<svg class="sign ${cls||""}" viewBox="0 0 64 64" aria-hidden="true">${shape}<g${shift}>${ic}</g></svg>`;
}
const PASS=8;
let scores={},profile={name:"",email:""};
try{scores=JSON.parse(localStorage.getItem("tsi_scores")||"{}")||{}}catch(e){scores={}}
try{profile=Object.assign(profile,JSON.parse(localStorage.getItem("tsi_profile")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("tsi_scores",JSON.stringify(scores))}catch(e){}}
function saveProfile(){try{localStorage.setItem("tsi_profile",JSON.stringify(profile))}catch(e){}}
const key=(th,i)=>th.id+"-"+i;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=document.getElementById("app"),band=document.getElementById("bandIn");
let state={view:"home"};

function go(s,push){state=s;if(push!==false){try{history.pushState({v:1},"")}catch(e){}}render();window.scrollTo(0,0)}
window.addEventListener("popstate",()=>{
  if(state.view==="quiz"&&!state.done){state.quit=true;render();try{history.pushState({v:1},"")}catch(e){}return}
  if(state.view==="quiz"||state.view==="result")go({view:"theme",th:state.th},false);
  else if(state.view==="theme")go({view:"home"},false);
});
function passedCount(th){return th.tests.filter((_,i)=>scores[key(th,i)]>=PASS).length}

function renderHome(){
  band.innerHTML=`<div class="brand">${LOGO.replace('class="sign"','class="sign sm"')}<div class="brand-name">Test Sécurité<small>Industrie</small></div></div>`;
  const total=T.reduce((a,th)=>a+passedCount(th),0);
  app.innerHTML=`<section class="hero fade">
    <h1>100 tests sécurité pour techniciens</h1>
    <p>10 thèmes, 10 tests par thème, 10 questions par test. Un test est validé à partir de ${PASS}/10.</p>
    <div class="meter"><div class="meter-num">${total}<span>/100</span></div><div><div class="meter-lbl">Tests validés</div><div class="bar"><i style="width:${total}%"></i></div></div></div>
  </section>
  <div class="section-lbl">Thèmes</div>
  <div class="grid">${T.map((th,i)=>{const p=passedCount(th);return `<button class="card" data-th="${i}">${sign(th)}<div><h3>${esc(th.name)}</h3><p>${p}/10 tests validés</p><div class="bar"><i style="width:${p*10}%"></i></div></div><span class="chev">›</span></button>`}).join("")}</div>
  <p class="note">Questions basées sur la réglementation et les bonnes pratiques françaises. Cette application aide à réviser : elle ne remplace pas les formations obligatoires (habilitations, CACES, attestations) ni les consignes de votre site. <a href="confidentialite.html" style="color:inherit">Politique de confidentialité</a></p>`;
  app.querySelectorAll(".card").forEach(b=>b.onclick=()=>go({view:"theme",th:+b.dataset.th}));
}
function backBtn(label){return `<button class="back" id="backBtn" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>`}
function renderTheme(){
  const th=T[state.th];
  band.innerHTML=`${backBtn()}<div class="band-title">${esc(th.name)}</div><div class="band-count">${passedCount(th)}/10</div>`;
  document.getElementById("backBtn").onclick=()=>history.back();
  app.innerHTML=`<div class="theme-head fade">${sign(th)}<div><h2>${esc(th.name)}</h2><p>10 tests de 10 questions</p></div></div>
  <div class="grid" style="margin-top:12px">${th.tests.map((t,i)=>{const s=scores[key(th,i)];const chip=s==null?`<span class="chip new">À faire</span>`:`<span class="chip ${s>=PASS?"ok":"bad"}">${s}/10</span>`;return `<button class="test" data-i="${i}"><div class="test-n">${i+1}</div><div><h3>${esc(t.t)}</h3><p>${s==null?"Jamais passé":s>=PASS?"Validé · meilleur score":"À revoir · meilleur score"}</p></div>${chip}</button>`}).join("")}</div>`;
  app.querySelectorAll(".test").forEach(b=>b.onclick=()=>startQuiz(state.th,+b.dataset.i));
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(ti,i,noPush){
  const th=T[ti],test=th.tests[i];
  const qs=test.q.map(q=>{const isVF=q[1]===VF;const order=q[1].map((_,k)=>k);if(!isVF)shuffle(order);return{q:q[0],opts:order.map(k=>q[1][k]),good:order.indexOf(q[2]),expl:q[3]}});
  go({view:"quiz",th:ti,ti:i,qs,cur:0,answers:[],picked:null,quit:false,done:false},!noPush);
}
function renderQuiz(){
  const th=T[state.th],test=th.tests[state.ti],q=state.qs[state.cur];
  band.innerHTML=`${backBtn()}<div class="band-title">Test ${state.ti+1} · ${esc(th.name)}</div><div class="band-count">${state.cur+1}/10</div>`;
  document.getElementById("backBtn").onclick=()=>{state.quit=true;render()};
  const answered=state.picked!=null,L="ABCD";
  const ok=answered&&state.picked===q.good;
  app.innerHTML=`<div class="qtop"><div class="qmeta"><span>${esc(test.t)}</span><span>Question ${state.cur+1} sur 10</span></div><div class="bar"><i style="width:${(state.cur+(answered?1:0))*10}%"></i></div></div>
  <div class="fade"><p class="qtext">${esc(q.q)}</p>
  <div class="opts">${q.opts.map((o,k)=>{let c="";if(answered){if(k===q.good)c="good";else if(k===state.picked)c="wrong";else c="dim"}return `<button class="opt ${c}" data-k="${k}" ${answered?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
  ${answered?`<div class="expl ${ok?"okk":"bad"}"><b>${ok?"Bonne réponse":"Mauvaise réponse"}</b>${esc(q.expl)}</div><div class="actions"><button class="btn" id="next">${state.cur<9?"Question suivante":"Voir mon résultat"}</button></div>`:""}
  ${state.quit?`<div class="quitbar"><p>Quitter le test ? Votre progression sur ce test sera perdue.</p><div class="row2"><button class="btn ghost" id="stay">Continuer</button><button class="btn dark" id="leave">Quitter</button></div></div>`:""}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(state.picked!=null)return;state.picked=+b.dataset.k;state.answers[state.cur]=state.picked;render()});
  const n=document.getElementById("next");if(n){n.onclick=()=>{if(state.cur<9){state.cur++;state.picked=null;render();window.scrollTo(0,0)}else finish()};n.focus({preventScroll:true})}
  const s=document.getElementById("stay");if(s)s.onclick=()=>{state.quit=false;render()};
  const l=document.getElementById("leave");if(l)l.onclick=()=>{state.done=true;history.back()};
  if(state.quit)document.querySelector(".quitbar").scrollIntoView({block:"center"});
}
function finish(){
  const sc=state.qs.reduce((a,q,i)=>a+(state.answers[i]===q.good?1:0),0);
  const k=key(T[state.th],state.ti);
  if(scores[k]==null||sc>scores[k]){scores[k]=sc;save()}
  state.done=true;
  go({view:"result",th:state.th,ti:state.ti,qs:state.qs,answers:state.answers,score:sc,date:new Date(),mail:null},false);
}
function fmtDate(d){return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"})+" à "+d.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function reportText(){
  const th=T[state.th],t=th.tests[state.ti],ok=state.score>=PASS;
  let s=`TEST SÉCURITÉ INDUSTRIE\n\n`;
  if(profile.name)s+=`Technicien : ${profile.name}\n`;
  s+=`Thème : ${th.name}\nTest ${state.ti+1} : ${t.t}\nDate : ${fmtDate(state.date)}\nRésultat : ${state.score}/10 – ${ok?"VALIDÉ":"À REVOIR"}\n\nDÉTAIL DES RÉPONSES\n`;
  state.qs.forEach((q,i)=>{const a=state.answers[i];const good=a===q.good;s+=`\n${i+1}. ${q.q}\n   ${good?"✔ Correct":"✘ Incorrect"} – votre réponse : ${q.opts[a]}\n`;if(!good)s+=`   Bonne réponse : ${q.opts[q.good]}\n`});
  s+=`\nSeuil de validation : ${PASS}/10.`;
  return s;
}
function renderResult(){
  const th=T[state.th],t=th.tests[state.ti],ok=state.score>=PASS;
  band.innerHTML=`${backBtn()}<div class="band-title">Résultat</div><div class="band-count">${state.score}/10</div>`;
  document.getElementById("backBtn").onclick=()=>history.back();
  const wrong=state.qs.map((q,i)=>({q,i,a:state.answers[i]})).filter(x=>x.a!==x.q.good);
  const m=state.mail;
  app.innerHTML=`<section class="result fade">
  <div class="score"><small>${esc(th.name)} · Test ${state.ti+1}</small><div class="score-num">${state.score}<span>/10</span></div><div class="stamp ${ok?"ok":"bad"}">${ok?"Validé":"À revoir"}</div><small>${esc(t.t)} · ${fmtDate(state.date)}</small></div>

  <div class="panel" id="mailPanel">
    <h3>Recevoir mon résultat</h3>
    <p>Entrez votre adresse email pour recevoir le détail de votre test.</p>
    <label for="fName">Nom et prénom<input id="fName" autocomplete="name" value="${esc(profile.name)}" placeholder="Ex. Jean Dupont"></label>
    <label for="fMail">Adresse email<input id="fMail" type="email" inputmode="email" autocomplete="email" value="${esc(profile.email)}" placeholder="nom@exemple.fr"></label>
    <div id="mailErr" class="err" hidden></div>
    <button class="btn" id="sendMail">${m?"Mettre à jour":"Recevoir mon résultat par email"}</button>
    ${m?`<p class="okmsg">Résultat prêt pour <span class="addr">${esc(m)}</span>.</p><a class="btn dark" id="openMail" href="${esc(state.href)}" target="_blank" rel="noopener">Ouvrir ma messagerie</a><p>Votre messagerie s'ouvre avec le résultat déjà rédigé : appuyez sur Envoyer. Elle ne s'ouvre pas ? Copiez le résultat et collez-le dans un email.</p><button class="btn ghost" id="copyRes">Copier le résultat</button><div id="copyMsg" class="okmsg" hidden>Résultat copié.</div>`:""}
  </div>

  ${wrong.length?`<div class="panel"><h3>Corrections</h3><div class="review">${wrong.map(x=>`<div class="rv"><p class="q">${x.i+1}. ${esc(x.q.q)}</p><p class="a">Votre réponse : ${esc(x.q.opts[x.a])}</p><p class="a">Bonne réponse : <b>${esc(x.q.opts[x.q.good])}</b></p><p class="a">${esc(x.q.expl)}</p></div>`).join("")}</div></div>`:`<div class="panel"><h3>Sans faute</h3><p>Toutes vos réponses sont correctes.</p></div>`}

  <div class="actions">
    <button class="btn dark" id="retry">Refaire ce test</button>
    ${state.ti<9?`<button class="btn" id="nextTest">Test suivant</button>`:""}
    <button class="btn ghost" id="toTheme">Retour aux tests</button>
  </div></section>`;
  document.getElementById("retry").onclick=()=>startQuiz(state.th,state.ti,true);
  const nt=document.getElementById("nextTest");if(nt)nt.onclick=()=>startQuiz(state.th,state.ti+1,true);
  document.getElementById("toTheme").onclick=()=>history.back();
  document.getElementById("sendMail").onclick=()=>{
    const name=document.getElementById("fName").value.trim(),mail=document.getElementById("fMail").value.trim();
    const e=document.getElementById("mailErr");
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(mail)){e.textContent="Adresse email invalide. Vérifiez qu'elle contient bien @ et un point, par exemple nom@exemple.fr.";e.hidden=false;return}
    e.hidden=true;profile.name=name;profile.email=mail;saveProfile();state.mail=mail;
    const subj=`Résultat Test Sécurité Industrie – ${th.name} test ${state.ti+1} : ${state.score}/10`;
    const href=`mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(subj)}&body=${encodeURIComponent(reportText())}`;
    state.href=href;render();
    document.getElementById("mailPanel").scrollIntoView({block:"start"});
  };
  const cp=document.getElementById("copyRes");
  if(cp)cp.onclick=()=>{const txt=reportText();const done=()=>{document.getElementById("copyMsg").hidden=false};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallbackCopy(txt,done))}else fallbackCopy(txt,done)};
}
function fallbackCopy(txt,done){const ta=document.createElement("textarea");ta.value=txt;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");done()}catch(e){}ta.remove()}
function render(){
  if(state.view==="home")renderHome();
  else if(state.view==="theme")renderTheme();
  else if(state.view==="quiz")renderQuiz();
  else renderResult();
}
try{history.replaceState({v:0},"")}catch(e){}
render();
})();
</script>
<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})})}</script>
</body>
</html>
